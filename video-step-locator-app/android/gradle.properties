# 本机仅 16G 内存且常被占用，模板默认 -Xmx8G 会导致 GC/交换风暴；调低以适配
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
# 关闭 Kotlin 增量编译：规避 "Could not close incremental caches" 已知问题（video_player_android 编译必现）
kotlin.incremental=false
# 网络超时：官方源不可达时快速失败，避免无限挂起
org.gradle.internal.http.connectionTimeout=20000
org.gradle.internal.http.socketTimeout=30000
# 本机代理(Clash/V2Ray @127.0.0.1:7890)非必须：所有依赖已走国内镜像(见根 build.gradle.kts 与 ~/.gradle/init.gradle)，
# 代理未运行时开启反而会导致 Connection refused 构建失败。已注释停用（2026-08-27）。
# 如需官方源兜底可重新放开并确保代理在运行。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
android.useAndroidX=true
# 抑制 AGP9 checkDebugAarMetadata 失败：flutter_plugin_android_lifecycle 要求 compileSdk>=35，
# 插件子模块（如 file_picker 8.x）自身声明 34，本工程实际 compileSdk=36 已满足运行要求，仅抑制元数据检查。
android.suppressUnsupportedCompileSdk=36
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Flutter 模板默认 false（为兼容旧工程）；本工程用 Java 版 file_picker 8.x，无需内建 Kotlin
android.builtInKotlin=false

